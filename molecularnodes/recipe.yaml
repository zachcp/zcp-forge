context:
  version: 520.2.0

package:
  name: molecularnodes
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/m/molecularnodes/molecularnodes-${{ version }}.tar.gz
    sha256: 43f149e83254bbe575bae84d3615c28058af3ccf817067ec37207c494ad8f50f

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  number: 0

requirements:
  host:
    - python =3.13
    - pip
    - setuptools >=61.0
  run:
    - python =3.13
    - databpy >=0.9.0
    - mdanalysis >=2.10
    - biotite >=1.7.1
    - mrcfile
    - starfile
    - imdclient >=0.2.3
    - pandas <3.0.0
    - griddataformats >=1.2.0
    - nodebpy >=520.27.0,<520.32  # 520.32 dropped nodebpy.builder.arrange_tree
    - bpy 5.2.*

tests:
  - python:
      imports:
        - molecularnodes
      pip_check: false # note there is a hatchling-cython error that shows up here

about:
  summary: Toolbox for molecular animations with Blender and Geometry Nodes.
  description: |
    Blender module for excellent drawing of molecules.
  documentation: https://bradyajohnston.github.io/MolecularNodes
