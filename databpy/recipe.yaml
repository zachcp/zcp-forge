context:
  version: 0.12.0

package:
  name: databpy
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/d/databpy/databpy-${{ version }}.tar.gz
    sha256: 00275ba0cc17082ea263fe243176b71763b0f4ee7e05e4152e5404de847334a3

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python =3.13
    - pip
    - uv-build >=0.8.15,<0.9.0
  run:
    - python =3.13
    - bpy >=5.1
    - numpy

tests:
  - python:
      imports:
        - databpy
      pip_check: true

about:
  summary: A data-oriented wrapper library for the Blender Python API
  license: GPL-3.0

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
