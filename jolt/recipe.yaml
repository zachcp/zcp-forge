context:
  version: "0.8.25"

package:
  name: jolt
  version: ${{ version }}

source:
  - if: linux and x86_64
    then:
      url: https://github.com/jolt-lang/jolt/releases/download/v${{ version }}/jolt-v${{ version }}-x86_64-linux.tar.gz
      sha256: 07d5d8903295fdbf1caf310bedb11952880d863b31302b9c3f7e90ac4f3dfc71
  - if: osx and arm64
    then:
      url: https://github.com/jolt-lang/jolt/releases/download/v${{ version }}/jolt-v${{ version }}-aarch64-macos.tar.gz
      sha256: 7b07ae2db68df0f47abe928f02301f8e7915bc75a40d5ec3c8e6628de416b231

build:
  number: 0
  skip:
    - not ((linux and x86_64) or (osx and arm64))
  # The release binary carries its boot image as trailing bytes; relinking or
  # re-signing it would corrupt that.
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore: true
  script:
    - mkdir -p "$PREFIX/bin" "$PREFIX/share/jolt"
    - install -m 0755 jolt "$PREFIX/bin/jolt"
    - cp -R LICENSE NOTICE licenses "$PREFIX/share/jolt/"

requirements:
  run:
    # `jolt build --library` compiles and links against a Chez install; jolt
    # finds its kernel files next to `scheme` on PATH.
    - chezscheme ==10.4.1

tests:
  - script:
      - jolt --version
      - jolt -e '(+ 1 2)'

about:
  homepage: https://jolt-lang.net
  repository: https://github.com/jolt-lang/jolt
  license: EPL-2.0
  license_file: LICENSE
  summary: A Clojure implementation on Chez Scheme

extra:
  recipe-maintainers:
    - zachcp
