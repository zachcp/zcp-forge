package:
  name: pypept
  version: "1.0"

source:
  url: https://github.com/Boehringer-Ingelheim/pyPept/archive/4214ca54c0d0e3cb0a15b906bf04955108898ab1.zip
  sha256: f7b86cdd181dc7f21f03ee600627dd8747af7adf66ac8353359e158b0c902920

build:
  noarch: python
  number: 1
  script:
    - pip install . -v --no-deps
  python:
    entry_points:
      - run_pyPept = pyPept.interfaces.run_pyPept:main
      - pyPept-BILN-validate = pyPept.interfaces.cli_BILN_validityChecker:run_as_standalone

requirements:
  host:
    - pip
    - python >=3.9
    - rdkit
    - setuptools
    - wheel
  run:
    - python >=3.9
    - biopython >=1.79
    - numpy >=1.22.2
    - pandas >=1.4.1,<3
    - python-igraph >=0.9.10
    - rdkit
    - requests >=2.27.1

tests:
  - script:
      - run_pyPept --help
      - pyPept-BILN-validate --help

about:
  homepage: https://github.com/Boehringer-Ingelheim/pyPept
  summary: Peptides Using the BILN Line Notation
  description: |-
    Peptides Using the BILN Line Notation
  license: MIT
  repository: https://github.com/Boehringer-Ingelheim/pyPept
