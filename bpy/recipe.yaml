context:
  version: "5.2.4"

package:
  name: bpy
  version: ${{ version }}

source:
  - if: win and x86_64
    then:
      url: "https://files.pythonhosted.org/packages/83/bf/82e507d8325258222bf772030f02e95f267cd794fa25f395a9e26a37b56b/bpy-5.2.4-cp313-cp313-win_amd64.whl"
      sha256: 08aa5f8c649eb099e700b093000eff86601c51a157f6bff3b73ca553f122236e
  - if: linux and x86_64
    then:
      url: "https://files.pythonhosted.org/packages/85/da/79a86492f2a3b1f08c40cbd5e3db5200f9ad7279cab44e5ba82cf398856a/bpy-5.2.4-cp313-cp313-manylinux_2_28_x86_64.whl"
      sha256: 3d55d6123a1fe1735275067e23989acf511b6df9dfb4be236986aaaeb43bb332
  - if: osx and arm64
    then:
      url: "https://files.pythonhosted.org/packages/a1/a9/169764de34048c13bc85740194fbf143b950d812b11fe682a3601e85a8a8/bpy-5.2.4-cp313-cp313-macosx_11_0_arm64.whl"
      sha256: 41d961bfa066fb8a46db43a013e191b0b78a9d1018edb311d9101e00200e1ee5

build:
  number: 0
  skip:
    - osx and x86_64
  script: pip install --no-deps *.whl

requirements:
  host:
    - python =3.13
    - python_abi ==3.13
    - pip
    - wheel
  run:
    - python =3.13
    - python_abi ==3.13
    - cattrs
    - cython
    - numpy >=2.2,<3.0
    - requests
    - zstandard

tests:
  - python:
      imports:
        - bpy

about:
  homepage: https://pypi.org/project/bpy/
  license: GPL-3.0
  summary: Blender as a Python Module
