context:
  version: 520.31.0

package:
  name: nodebpy
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/n/nodebpy/nodebpy-${{ version }}.tar.gz
    sha256: c7e420787a89acad008680ad80ff5e89e005fd4b346e91a8de7f4eef3432b862

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python =3.13
    - pip
    - uv-build >=0.8.15,<0.9.0
  run:
    - python =3.13
    - bpy 5.2.*

tests:
  - python:
      imports:
        - nodebpy
      pip_check: true

about:
  summary: Build nodes trees in Blender more elegantly with code
  homepage: https://pypi.org/project/nodebpy/
  license: GPL-3.0-or-later
